{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<form class="language-switch__form" action="{% url 'set_language' %}" method="post">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <button
        class="language-toggle{% if LANGUAGE_CODE == 'en' %} is-en{% endif %}"
        type="submit"
        name="language"
        value="{% if LANGUAGE_CODE == 'tr' %}en{% else %}tr{% endif %}"
        aria-label="{% if LANGUAGE_CODE == 'tr' %}{% translate 'İngilizceye geç' %}{% else %}{% translate 'Türkçeye geç' %}{% endif %}"
        title="{% if LANGUAGE_CODE == 'tr' %}{% translate 'İngilizceye geç' %}{% else %}{% translate 'Türkçeye geç' %}{% endif %}"
    >
        <span class="language-toggle__labels" aria-hidden="true">
            <span class="language-toggle__label language-toggle__label--tr">TR</span>
            <span class="language-toggle__label language-toggle__label--en">EN</span>
        </span>
        <span class="language-toggle__knob" aria-hidden="true"></span>
    </button>
</form>
