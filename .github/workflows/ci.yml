name: Django CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: erp_test
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EMAIL_HOST: localhost
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      SENTRY_DISABLED: "true"
      OPENAI_API_KEY: ""
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Kritik statik analiz
        run: ruff check .

      - name: Güvenlik analizi
        run: bandit -q -c .bandit.yaml -r .

      - name: Bağımlılık güvenlik analizi
        run: pip-audit -r requirements.txt

      - name: Django denetimi
        run: python manage.py check

      - name: Migration denetimi
        run: python manage.py makemigrations --check --dry-run

      - name: Testler
        run: coverage run manage.py test

      - name: Kapsama raporu
        run: coverage report
